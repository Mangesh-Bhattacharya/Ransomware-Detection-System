[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = [
    "S101",  # assert used (fine in tests and defensive checks)
    "S603",  # subprocess call - reviewed manually in auto_response.py
    "S607",  # partial executable path - netsh/ip are expected on PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
